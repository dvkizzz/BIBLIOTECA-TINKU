<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Panel - BIBLIOTECA TINKU</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="dashboard-container">
        <div class="header-bar">
            <h2 id="welcomeMsg">Mi Panel</h2>
            <div style="display: flex; gap: 10px;">
                <a href="index.html" class="btn" style="text-decoration:none;">Catálogo</a>
                <button class="btn btn-danger" id="logoutBtn" style="width:auto;">Cerrar Sesión</button>
            </div>
        </div>
        
        <div id="messageBox" class="message"></div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('prestamos')">Mis Préstamos</button>
            <button class="tab-btn" onclick="switchTab('reservas')">Mis Reservas</button>
            <button class="tab-btn" onclick="switchTab('perfil')">Mi Perfil</button>
        </div>

        <div id="tab-prestamos" class="tab-content active section">
            <h3>Mis Préstamos Activos y Pasados</h3>
            <table>
                <thead>
                    <tr>
                        <th>Libro</th>
                        <th>Fecha Préstamo</th>
                        <th>Vencimiento</th>
                        <th>Multa</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="prestamosBody">
                    <tr><td colspan="5">Cargando préstamos...</td></tr>
                </tbody>
            </table>
        </div>

        <div id="tab-reservas" class="tab-content section">
            <h3>Mis Reservas</h3>
            <table>
                <thead>
                    <tr>
                        <th>Libro</th>
                        <th>Fecha de Reserva</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="reservasBody">
                    <tr><td colspan="3">Cargando reservas...</td></tr>
                </tbody>
            </table>
        </div>

        <div id="tab-perfil" class="tab-content section">
            <h3>Mi Perfil</h3>
            <form id="profileForm" style="margin-top:20px;">
                <div class="form-group">
                    <label>Nombre Actual</label>
                    <input type="text" id="perfilNombre" disabled>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="perfilEmail" disabled>
                </div>
                <h4 style="margin:20px 0 10px 0;">Cambiar Contraseña</h4>
                <div class="form-group">
                    <label>Nueva Contraseña</label>
                    <input type="password" id="newPassword" required minlength="6">
                </div>
                <button type="submit" class="btn" style="max-width: 400px;">Actualizar Contraseña</button>
            </form>
        </div>

    </div>

    <script src="js/api.js"></script>
    <script src="js/dashboard_usuario.js"></script>
    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            event.target.classList.add('active');
        }
    </script>
</body>
</html>
